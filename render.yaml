# Cấu hình triển khai lên Render (render.com) - Render sẽ tự nhận file này
# khi tạo "New +" -> "Blueprint" và trỏ vào repo GitHub của bạn.
# Có thể bỏ qua file này và tạo Web Service thủ công trên Render UI, dùng
# đúng buildCommand/startCommand bên dưới.
services:
  - type: web
    name: parking-ai-system
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    envVars:
      - key: DATABASE_URL
        sync: false   # dán connection string Postgres của Supabase vào đây trên Render Dashboard
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
